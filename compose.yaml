services:
  postgres:
    image: postgres:17
    container_name: patchledger-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: patchledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: patchledger
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchledger -d patchledger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: